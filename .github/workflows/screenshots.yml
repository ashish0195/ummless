name: Screenshots

# Builds the app, runs the backend in demo mode, launches each screen in the iOS Simulator with seeded demo
# data and commits the screenshots to docs/screenshots on the branch it ran for.
# Runs when a pushed commit message starts with "[screenshots]", or manually.
on:
  push:
    branches: ["claude/**", main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, '[screenshots]')
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ffmpeg
        run: brew install ffmpeg >/dev/null

      - name: Start the backend in demo mode
        working-directory: backend
        env:
          AI_PROVIDER: mock
          ALLOW_DEV_ENTITLEMENTS: "true"
          SECRET_KEY: screenshots-only-secret
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements.txt
          nohup .venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/backend.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/v1/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/v1/health

      - name: Select the newest installed Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version

      - name: Build for the iOS Simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project Comlogue.xcodeproj -scheme Comlogue -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO build -quiet

      - name: Capture screenshots
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys, re
          data = json.load(sys.stdin)["devices"]
          phones = [d for runtime, ds in data.items() if "iOS" in runtime for d in ds if re.match(r"iPhone \d+ Pro$", d["name"])]
          phones.sort(key=lambda d: d["name"])
          print(phones[-1]["udid"])')
          echo "Using device $DEVICE"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time 9:41 --dataNetwork wifi --wifiBars 3 \
            --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
          APP=$(find ios/build/DerivedData -name "Comlogue.app" -path "*iphonesimulator*" | head -1)
          xcrun simctl install "$DEVICE" "$APP"
          # Grant the microphone up front so the permission alert doesn't cover the conversation screens.
          xcrun simctl privacy "$DEVICE" grant microphone com.comlogue.app || true
          mkdir -p docs/screenshots
          crashed=""
          capture() {
            # simctl prints "com.comlogue.app: <pid>"; the simulated app is a host process, so kill -0 checks it.
            pid=$(xcrun simctl launch --terminate-running-process "$DEVICE" com.comlogue.app -ComlogueScreenshotScene "$1" | awk '{print $NF}') || pid=""
            sleep "${3:-10}"
            xcrun simctl io "$DEVICE" screenshot "docs/screenshots/$2.png"
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "::error title=App crashed::The app was not running after opening the $1 scene"
              crashed="$crashed $1"
            fi
          }
          xcrun simctl ui "$DEVICE" appearance light
          for scene in welcome getStarted activity spar results recording debrief today course mission practice you paywall \
                       daily dailyFeedback inbox notifications plan group groupReport; do
            capture "$scene" "$scene"
          done
          # The same app as an Indian account: ₹ pricing, placement interviews, group discussions, Hindi notices.
          for scene in todayIndia practiceIndia paywallIndia groupIndia planIndia consentIndia; do
            capture "$scene" "$scene"
          done
          xcrun simctl ui "$DEVICE" appearance dark
          for scene in today results you daily; do
            capture "$scene" "dark-$scene"
          done
          echo "crashed=$crashed" >> "$GITHUB_ENV"

      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "No screenshot changes"
          else
            git commit -m "Update app screenshots"
            # The branch may have moved while the simulator ran; this commit only touches docs/screenshots.
            for attempt in 1 2 3; do
              if git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}"; then
                exit 0
              fi
              sleep 5
            done
            exit 1
          fi

      - name: Upload backend log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: ${{ runner.temp }}/backend.log

      - name: Collect crash reports
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/crashes"
          find ~/Library/Logs/DiagnosticReports -name 'Comlogue*' -exec cp {} "$RUNNER_TEMP/crashes/" \; 2>/dev/null || true
          ls "$RUNNER_TEMP/crashes"

      - name: Upload crash reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crash-reports
          path: ${{ runner.temp }}/crashes
          if-no-files-found: ignore

      - name: Fail if the app crashed
        if: env.crashed != ''
        run: |
          echo "The app crashed in:${crashed}"
          exit 1
