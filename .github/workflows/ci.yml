name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    # Same base image as backend/Dockerfile; its Debian mirrors install ffmpeg in seconds.
    container: python:3.13-slim
    timeout-minutes: 20
    env:
      PIP_ROOT_USER_ACTION: ignore
    steps:
      - uses: actions/checkout@v5
      - name: Install ffmpeg
        run: apt-get update -q && apt-get install -y -q --no-install-recommends ffmpeg
      - name: Install dependencies
        working-directory: backend
        run: pip install -q -r requirements.txt
      - name: Run tests
        working-directory: backend
        run: pytest -q
      - name: Export contract fixtures from this backend
        working-directory: backend
        run: python scripts/export_contract_fixtures.py
      - uses: actions/upload-artifact@v4
        with:
          name: contract-fixtures
          path: contract-fixtures

  docker:
    name: Backend Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the image
        run: docker build -t comlogue-api backend
      - name: Refuses to start in production without a real SECRET_KEY
        run: |
          if docker run --rm comlogue-api python -c "from app.config import get_settings; get_settings()"; then
            echo "Started with the placeholder secret"; exit 1
          fi
      - name: Refuses to start in production without an OpenAI key
        run: |
          if docker run --rm -e SECRET_KEY="$(openssl rand -hex 32)" comlogue-api \
              python -c "from app.config import get_settings; get_settings()"; then
            echo "Started without OPENAI_API_KEY"; exit 1
          fi
      - name: Starts and answers the health check
        run: |
          # An explicit demo: production otherwise needs OPENAI_API_KEY. Purchase verification uses the bundled root.
          docker run -d --name api -p 8000:8000 -e SECRET_KEY="$(openssl rand -hex 32)" -e AI_PROVIDER=mock comlogue-api
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/v1/health; then exit 0; fi
            sleep 2
          done
          docker logs api
          exit 1

  swift-core:
    name: Swift core + contract tests (Linux)
    needs: backend
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v5
      - name: Use the fixtures the backend just produced
        uses: actions/download-artifact@v4
        with:
          name: contract-fixtures
          path: contract-fixtures
      - name: Build and test the platform-independent core
        working-directory: ios
        run: swift test

  ios-app:
    name: iOS app build (Xcode)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Select the newest installed Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          echo "Using $latest"
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version
      - name: Build for the iOS Simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project Comlogue.xcodeproj \
            -scheme Comlogue \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*(deprecated|will be an error)|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ios/build.log
