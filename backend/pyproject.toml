[project]
name = "comlogue-backend"
version = "1.0.0"
description = "Comlogue — AI communication coach backend"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "B008",  # FastAPI dependency injection uses calls in defaults by design
    "E501",  # long strings in prompts/content are intentional
]

[tool.ruff.lint.per-file-ignores]
"app/domain/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
