# Local stack: API + Postgres. `docker compose up --build`
services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://comlogue:comlogue@db:5432/comlogue
      MEDIA_DIR: /data/media
      ENVIRONMENT: development
    volumes:
      - media:/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: comlogue
      POSTGRES_PASSWORD: comlogue
      POSTGRES_DB: comlogue
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comlogue"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  media:
  pgdata:
